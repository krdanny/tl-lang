  <text x="84" y="273" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#e2e8f0"><tspan fill="#f472b6">fn</tspan> classify n<tspan fill="#64748b">|</tspan><tspan fill="#f472b6">if</tspan> n&gt;100<tspan fill="#64748b">|</tspan><tspan fill="#86efac">"huge</tspan><tspan fill="#64748b">&lt;</tspan><tspan fill="#f472b6">elif</tspan> n&gt;10<tspan fill="#64748b">|</tspan><tspan fill="#86efac">"big</tspan><tspan fill="#64748b">&lt;</tspan><tspan fill="#f472b6">else</tspan><tspan fill="#64748b">|</tspan><tspan fill="#86efac">"small</tspan><tspan fill="#64748b">&lt;&lt;</tspan><tspan fill="#f472b6">for</tspan> n[5 50 500<tspan fill="#64748b">|</tspan>print n(classify n</text>
